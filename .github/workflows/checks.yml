name: ClinicShield checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        id: install
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check code security
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m bandit -r clinicshield app.py docs/create_workbook.py -lll

      - name: Check dependency security
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pip_audit -r requirements.txt