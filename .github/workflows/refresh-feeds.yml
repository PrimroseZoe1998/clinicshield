name: Refresh public feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: public-feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        id: install
        run: python -m pip install -r requirements.txt

      - name: Refresh public feeds
        run: |
          mkdir -p feed-output
          python -m clinicshield.refresh_feeds \
            --cache-dir feed-output \
            --eol-product python \
            --eol-product windows \
            2>&1 | tee feed-output/refresh.log

      - name: Preserve snapshots and refresh log
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: public-feeds-${{ github.run_id }}
          path: feed-output/
          if-no-files-found: error
          retention-days: 30