name: Refresh public feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: public-feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        id: install
        run: python -m pip install -r requirements.txt

      - name: Refresh public feeds
        run: |
          mkdir -p feed-output
          python -m clinicshield.refresh_feeds \
            --cache-dir feed-output \
            --status-file feed-output/refresh-status.json \
            --eol-product python \
            --eol-product windows \
            2>&1 | tee feed-output/refresh.log

      - name: Summarize refresh results
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path("feed-output/refresh-status.json")
          lines = ["## Public-feed refresh", ""]
          if report.exists():
              status = json.loads(report.read_text(encoding="utf-8"))
              lines += [f"Overall: {status['outcome']}", "", "| Feed | Result | Error |", "| --- | --- | --- |"]
              for feed in status["feeds"]:
                  lines.append(f"| {feed['source']} | {feed['outcome']} | {feed.get('error_type', '')} |")
              lines += ["", "Successful refreshes do not establish complete source coverage."]
          else:
              lines.append("Status report unavailable. Inspect the refresh log; do not assume success.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
          PY

      - name: Preserve snapshots and refresh log
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: public-feeds-${{ github.run_id }}
          path: feed-output/
          if-no-files-found: error
          retention-days: 30
