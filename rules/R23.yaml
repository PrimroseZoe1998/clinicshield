schema_version: 1
rule_id: R23
title: Staff security training gap
kind: checklist
handler: staff_security_training
description: >-
  Use Q25 to assess the staff security training described in the
  checklist. No indicates a reported safeguard gap. Unknown
  requires verification. Yes does not trigger this rule. Do not
  infer which staff members or training topics are affected.
severity: Medium
unknown_severity: Info
evidence_fields:
  - Q25
fix: >-
  Review the training expectations in Q25 and identify missing
  activities. Arrange appropriate staff security training, document
  participation, and establish a repeatable process for new staff
  and refresher training. Verify Unknown answers before describing
  training as absent.
owner: Security official and staff training coordinator
effort: 2
cost: unknown
framework_references:
- framework: NIST CSF 2.0
  reference: PR.AT-01 (partial)
  source: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf#page=25
  rationale: Partial project mapping; source checked October 29, 2026. Q25 reports training provision.
    Completion, effectiveness, role coverage, onboarding and annual curriculum review are not independently
    verified.
  review_status: reviewed
- framework: CIS Controls v8.1
  reference: 14.1 (partial; conditional where stated)
  source: https://www.cisecurity.org/controls/CIS-controls-navigator
  rationale: Partial project mapping; source checked October 29, 2026. Q25 reports training provision.
    Completion, effectiveness, role coverage, onboarding and annual curriculum review are not independently
    verified.
  review_status: reviewed
review_status: draft