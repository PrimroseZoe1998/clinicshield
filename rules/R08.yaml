  reference: PR.PS-02 (partial)
  source: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf#page=25
  rationale: Partial project mapping; source checked October 29, 2026. The support-related finding also
    records SMB presence. It does not identify an exploitable SMB defect or require disabling every file-sharing
    service.
  review_status: reviewed
- framework: CIS Controls v8.1
