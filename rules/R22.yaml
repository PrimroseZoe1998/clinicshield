schema_version: 1
rule_id: R22
title: Documented risk analysis gap
kind: checklist
handler: documented_risk_analysis
description: >-
  Use Q24b to assess the recent documented risk analysis described
  in the checklist. No indicates a reported gap. Unknown requires
  verification. Yes does not trigger this rule. Do not infer Q24b
  from the combined Q24 answer or from Q24a.
severity: High
unknown_severity: Info
evidence_fields:
  - Q24b
fix: >-
  Verify whether a recent documented risk analysis exists and
  addresses the organization's systems and risks. If missing,
  arrange an appropriately scoped analysis, document the findings,
  and assign follow-up actions to responsible owners.
owner: Security official and organizational leadership
effort: 3
cost: unknown
framework_references:
- framework: NIST CSF 2.0
  reference: ID.RA-04; ID.RA-05 (partial)
  source: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf#page=24
  rationale: Partial project mapping; source checked October 29, 2026. Q24b reports documented risk analysis.
    It does not verify assessment quality, complete threat coverage, likelihood methods or legal sufficiency.
  review_status: reviewed
- framework: HICP 2023
  reference: 'Volume 1: 10.S.B; printed p. 33 (partial)'
  source: https://hhscyber.hhs.gov/Documents/HICP/tech-vol1-508.pdf#page=36
  rationale: Partial project mapping; source checked October 30, 2026. Reported absence of documented
    risk analysis prompts follow-up; a Yes answer would not establish a thorough or sufficient legal
    risk analysis.
  review_status: reviewed
- framework: HIPAA Security Rule
  reference: 45 CFR 164.308(a)(1)(ii)(A) (partial; applicability-dependent)
  source: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-C/section-164.308
  rationale: Partial project mapping; source checked October 30, 2026. Reported absence of documented
    risk analysis prompts follow-up; a Yes answer would not establish a thorough or sufficient legal
    risk analysis. Supporting relationship only; not a compliance finding.
  review_status: reviewed
review_status: draft