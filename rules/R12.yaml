schema_version: 1
rule_id: R12
title: Email multifactor authentication gap
kind: technical
handler: email_mfa
description: >-
  Assess software entries whose purpose is email. An mfa_enabled
  value of N indicates a reported safeguard gap. Unknown or NA
  requires verification. Y produces no finding. Preserve the
  inventory evidence without inferring affected account counts
  or whether the authentication method is phishing resistant.
severity: High
unknown_severity: Info
evidence_fields:
  - asset_id
  - vendor
  - product
  - purpose
  - deployment
  - mfa_enabled
fix: >-
  Verify MFA coverage for email accounts and address confirmed
  gaps with the service owner. Confirm that protection covers all
  applicable accounts and document necessary exceptions. Review
  Unknown or NA values rather than treating them as enabled.
  Evaluate supported authentication options with the administrator.
owner: Email administrator or managed service provider
effort: 2
cost: unknown
framework_references:
- framework: NIST CSF 2.0
  reference: PR.AA-03 (partial)
  source: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf#page=24
  rationale: Partial project mapping; source checked October 29, 2026. Email MFA coverage is a project
    check. CIS 6.3 applies conditionally to externally exposed applications where supported; all account
    configurations are not verified.
  review_status: reviewed
- framework: CIS Controls v8.1
  reference: 6.3 (partial; conditional where stated)
  source: https://www.cisecurity.org/controls/CIS-controls-navigator
  rationale: Partial project mapping; source checked October 29, 2026. Email MFA coverage is a project
    check. CIS 6.3 applies conditionally to externally exposed applications where supported; all account
    configurations are not verified.
  review_status: reviewed
review_status: draft