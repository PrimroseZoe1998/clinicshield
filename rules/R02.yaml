  source: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf#page=23
  rationale: Partial project mapping; source checked October 29, 2026. Applicability is evaluated independently
    of EPSS. Priority context does not establish completed remediation or a comprehensive vulnerability
    program.
  review_status: reviewed
- framework: CIS Controls v8.1
