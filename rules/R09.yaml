schema_version: 1
rule_id: R09
title: Telnet service present
kind: technical
handler: telnet_service
description: >-
  Identify a TCP service explicitly recorded as Telnet, regardless
  of port number or exposure. Port 23 alone does not confirm Telnet.
  Unknown exposure must remain unknown.
severity: High
unknown_severity: Info
evidence_fields:
  - asset_id
  - host
  - port
  - protocol
  - service
  - exposure
fix: >-
  Confirm whether Telnet is needed. Disable it where unnecessary
  and use a supported encrypted administration method. Coordinate
  changes to medical or vendor-managed devices with the responsible
  vendor, and verify that required operations still work.
owner: IT administrator or device vendor
effort: 2
cost: unknown
framework_references:
- framework: NIST CSF 2.0
  reference: PR.PS-01 (partial)
  source: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf#page=25
  rationale: Partial project mapping; source checked October 29, 2026. A Telnet listener prompts configuration
    review. Actual management use, transmitted credentials and any operational necessity are not established
    by the listener.
  review_status: reviewed
- framework: CIS Controls v8.1
  reference: 4.6 (partial; conditional where stated)
  source: https://www.cisecurity.org/controls/CIS-controls-navigator
  rationale: Partial project mapping; source checked October 29, 2026. A Telnet listener prompts configuration
    review. Actual management use, transmitted credentials and any operational necessity are not established
    by the listener.
  review_status: reviewed
review_status: draft