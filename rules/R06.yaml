schema_version: 1
rule_id: R06
title: Remote administration exposure requires attention
kind: technical
handler: remote_admin_exposure
description: >-
  Assess TCP services explicitly identified as rdp, vnc, ssh,
  or telnet. Internet exposure produces a confirmed reported
  exposure finding. Unknown exposure requires verification.
  Internal exposure does not trigger this rule. Do not infer
  service identity from port numbers, missing authentication,
  exploitability, or unauthorized access.
severity: High
unknown_severity: Info
evidence_fields:
  - asset_id
  - host
  - port
  - protocol
  - service
  - exposure
fix: >-
  Verify whether remote administration is reachable from the
  internet and whether that access is necessary. Restrict exposure
  using an appropriately secured access design, review authentication
  and access controls, and disable unnecessary services. Verify
  Unknown exposure before describing a service as internet-facing.
  Coordinate changes to preserve required operations.
owner: Network administrator and system owner
effort: 2
cost: unknown
framework_references:
- framework: NIST CSF 2.0
  reference: PR.IR-01 (partial)
  source: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf#page=25
  rationale: Partial project mapping; source checked October 29, 2026. An internet-facing administration
    listener is a project risk signal. Necessary, authorized remote access is not categorically prohibited
    by these references.
  review_status: reviewed
- framework: CIS Controls v8.1
  reference: 4.8 (partial; conditional where stated)
  source: https://www.cisecurity.org/controls/CIS-controls-navigator
  rationale: Partial project mapping; source checked October 29, 2026. An internet-facing administration
    listener is a project risk signal. Necessary, authorized remote access is not categorically prohibited
    by these references.
  review_status: reviewed
review_status: draft