schema_version: 1
rule_id: R24
title: Software version requires verification
kind: technical
handler: unknown_software_version
description: >-
  Identify unknown software versions where touches_phi is Y or
  Unknown. Preserve uncertainty about both version and patient
  information access. Report a needs-review finding, not a
  confirmed vulnerability. Software with touches_phi N is outside
  this rule's scope; that exclusion does not establish safety.
severity: Info
unknown_severity: Info
evidence_fields:
  - asset_id
  - vendor
  - product
  - version
  - deployment
  - touches_phi
fix: >-
  Obtain the installed version or the cloud service's applicable
  release information from a reliable source. Verify whether the
  software accesses patient information when that status is unknown.
  Record unresolved vendor-managed version information explicitly.
  Reassess vulnerability applicability after verification without
  inventing a version or treating missing data as safe.
owner: IT administrator or application vendor
effort: 1
cost: unknown
framework_references:
- framework: NIST CSF 2.0
  reference: ID.AM-02 (partial)
  source: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf#page=23
  rationale: Partial project mapping; source checked October 29, 2026. Unknown versions require inventory
    follow-up. Versions are identifiers here, not proof of vulnerability; the rule does not audit every
    inventory field or its review cadence.
  review_status: reviewed
- framework: CIS Controls v8.1
  reference: 2.1 (partial; conditional where stated)
  source: https://www.cisecurity.org/controls/CIS-controls-navigator
  rationale: Partial project mapping; source checked October 29, 2026. Unknown versions require inventory
    follow-up. Versions are identifiers here, not proof of vulnerability; the rule does not audit every
    inventory field or its review cadence.
  review_status: reviewed
review_status: draft