schema_version: 1
rule_id: R03
title: Operating system support requires attention
kind: technical
handler: operating_system_support
description: >-
  Assess an operating system using explicitly matched lifecycle
  evidence. Confirm unsupported status only when the product and
  release are resolved, the evidence is current, and applicable
  extended-support coverage has been resolved. Missing, stale,
  ambiguous, or incomplete evidence requires review. Do not infer
  support status from an operating system name or age alone.
severity: High
unknown_severity: Info
evidence_fields:
  - asset_id
  - os_name
  - os_version
  - support_status
  - support_basis
  - source_url
  - retrieved_at
fix: >-
  Verify the operating system release and applicable support or
  extended-security-update coverage. For confirmed unsupported
  systems, plan a supported upgrade, replacement, or vendor-approved
  mitigation. Coordinate medical-device changes with the vendor.
  Resolve uncertain evidence before claiming a system is supported
  or unsupported.
owner: IT administrator and system vendor
effort: 3
cost: unknown
framework_references:
- framework: NIST CSF 2.0
  reference: PR.PS-02 (partial)
  source: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf#page=25
  rationale: Partial project mapping; source checked October 29, 2026. The rule evaluates a supplied OS
    release and support coverage. It does not assess every software exception, compensating control or
    residual-risk acceptance.
  review_status: reviewed
- framework: CIS Controls v8.1
  reference: 2.2 (partial; conditional where stated)
  source: https://www.cisecurity.org/controls/CIS-controls-navigator
  rationale: Partial project mapping; source checked October 29, 2026. The rule evaluates a supplied OS
    release and support coverage. It does not assess every software exception, compensating control or
    residual-risk acceptance.
  review_status: reviewed
review_status: draft