schema_version: 1
rule_id: R21
title: Security reporting or notification preparation gap
kind: checklist
handler: reporting_preparation
description: >-
  Use Q21 for reporting security problems and Q22 for breach
  notification preparation. Either No indicates a reported gap.
  If neither is No but either is Unknown, require verification.
  Both Yes produces no finding. Preserve both answers separately.
  Do not infer that a breach occurred or that notification is required.
severity: Medium
unknown_severity: Info
evidence_fields:
  - Q21
  - Q22
fix: >-
  Review each safeguard separately. For a Q21 gap, document how
  staff should report suspected security problems and whom to contact.
  For a Q22 gap, establish a process for assessing incidents and
  obtaining qualified guidance on notification obligations.
  Verify Unknown answers. Do not treat this finding as a breach
  determination or a decision that notification is legally required.
owner: Security official and organizational leadership
effort: 2
cost: unknown
framework_references:
- framework: NIST CSF 2.0
  reference: RS.CO-02 (partial)
  source: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf#page=27
  rationale: Partial project mapping; source checked October 29, 2026. Q21/Q22 address reporting and notification
    preparation. Preparation is narrower than actual incident notification; no breach, recipient, deadline
    or legal obligation is determined.
  review_status: reviewed
- framework: CIS Controls v8.1
  reference: 17.2; 17.3 (partial; conditional where stated)
  source: https://www.cisecurity.org/controls/CIS-controls-navigator
  rationale: Partial project mapping; source checked October 29, 2026. Q21/Q22 address reporting and notification
    preparation. Preparation is narrower than actual incident notification; no breach, recipient, deadline
    or legal obligation is determined.
  review_status: reviewed
review_status: draft