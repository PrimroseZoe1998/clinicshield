schema_version: 1
rule_id: R05
title: Portable-device encryption gap
kind: technical
handler: portable_encryption
description: >-
  Identify portable assets whose encryption is disabled or unknown.
  A disabled setting is a confirmed gap. An unknown setting requires
  verification and must not be reported as confirmed disabled.
severity: High
unknown_severity: Info
evidence_fields:
  - asset_id
  - portable
  - encrypted
fix: >-
  Verify device encryption status. If encryption is disabled, have the
  responsible IT administrator enable supported device encryption,
  securely manage recovery keys, and verify the result. Coordinate
  changes to managed or medical devices with the responsible vendor.
owner: IT administrator or managed service provider
effort: 2
cost: unknown
framework_references:
- framework: NIST CSF 2.0
  reference: PR.DS-01 (partial)
  source: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf#page=25
  rationale: Partial project mapping; source checked October 29, 2026. This rule covers portable assets
    and supplied encryption status only. It does not inventory every sensitive-data location or verify
    cryptographic configuration.
  review_status: reviewed
- framework: CIS Controls v8.1
  reference: 3.6 (partial; conditional where stated)
  source: https://www.cisecurity.org/controls/CIS-controls-navigator
  rationale: Partial project mapping; source checked October 29, 2026. This rule covers portable assets
    and supplied encryption status only. It does not inventory every sensitive-data location or verify
    cryptographic configuration.
  review_status: reviewed
review_status: draft