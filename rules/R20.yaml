schema_version: 1
rule_id: R20
title: Incident planning or security responsibility gap
kind: checklist
handler: incident_readiness
description: >-
  Assess Q20 for a written incident plan and Q24a for named security
  responsibility. Either No indicates a reported gap. If neither
  is No but either is Unknown, require verification. Both Yes
  produces no finding. Preserve both answers and identify which
  safeguard is missing or unknown. Do not use combined Q24 or Q24b.
severity: High
unknown_severity: Info
evidence_fields:
  - Q20
  - Q24a
fix: >-
  Verify each safeguard separately. If Q20 is No, establish and
  document an incident response plan with roles and contact details.
  If Q24a is No, assign and document security responsibility.
  Investigate Unknown answers without describing them as confirmed
  missing controls. Retain separate corrective actions for each gap.
owner: Organizational leadership and designated security official
effort: 3
cost: unknown
framework_references:
- framework: NIST CSF 2.0
  reference: ID.IM-04; GV.RR-02 (partial)
  source: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf#page=22
  rationale: Partial project mapping; source checked October 29, 2026. Q20 and Q24a distinguish an incident
    plan from security responsibility. General security ownership is broader than the CIS incident-handling
    role; neither answer tests execution.
  review_status: reviewed
- framework: CIS Controls v8.1
  reference: 17.1; 17.4 (partial; conditional where stated)
  source: https://www.cisecurity.org/controls/CIS-controls-navigator
  rationale: Partial project mapping; source checked October 29, 2026. Q20 and Q24a distinguish an incident
    plan from security responsibility. General security ownership is broader than the CIS incident-handling
    role; neither answer tests execution.
  review_status: reviewed
- framework: HICP 2023
  reference: 'Volume 1: 8.S.A; 10.S.A; printed p. 27 (partial)'
  source: https://hhscyber.hhs.gov/Documents/HICP/tech-vol1-508.pdf#page=30
  rationale: Partial project mapping; source checked October 30, 2026. Incident planning and security
    responsibility are separate branches. A combined finding does not mean both failed or that response
    procedures were exercised.
  review_status: reviewed
- framework: HIPAA Security Rule
  reference: 45 CFR 164.308(a)(6)(i); 164.308(a)(2) (partial; applicability-dependent)
  source: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-C/section-164.308
  rationale: Partial project mapping; source checked October 30, 2026. Incident planning and security
    responsibility are separate branches. A combined finding does not mean both failed or that response
